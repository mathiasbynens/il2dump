[package]
name = "il2dump"
version = "0.2.0"
edition = "2024"
authors = ["Mathias Bynens", "Perfare"]
description = "A portable, in-memory IL2CPP metadata dumper and C# decompiler library and CLI tool"
repository = "https://github.com/mathiasbynens/il2dump"
license = "MIT"
readme = "README.md"
keywords = ["il2cpp", "metadata", "dumper", "decompiler", "wasm"]
categories = ["development-tools::debugging", "wasm"]
include = [
	"/Cargo.toml",
	"/LICENSE",
	"/README.md",
	"/src/**/*",
]


[dependencies]
object = { version = "0.36", features = ["read"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
lz4_flex = "0.11"
clap = { version = "4.5", features = ["derive"] }
lazy_static = "1.5"

[lib]
name = "il2dump_lib"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"



